<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>«Ни в сказке сказать» · лендинг · превью дизайна</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#16171b;color:#e9e9ee;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 4vw;background:rgba(22,23,27,.92);backdrop-filter:blur(10px);border-bottom:1px solid #2a2c33}
.bar b{font-size:16px}.bar small{display:block;color:#9a9caa;font-size:12.5px}
.tg{display:flex;background:#24262d;border-radius:30px;padding:4px}.tg button{border:0;background:none;color:#c9cad3;font:600 14px inherit;padding:9px 18px;border-radius:30px;cursor:pointer}.tg button.on{background:#fff;color:#111}
.v{display:none;margin:28px auto 60px}.v.on{display:block}
#d{width:min(1440px,94vw)}#m{width:min(390px,94vw)}
.v img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.fr{border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}#m .fr{border-radius:30px;border:8px solid #2c2e35}
.note{text-align:center;color:#8d8f9c;font-size:13px;padding:0 4vw 40px}
</style></head><body oncontextmenu="return false">
<div class="bar"><div><b>«Ни в сказке сказать» · лендинг</b><small>Превью дизайна. Анимации и интерактив работают в готовой версии.</small></div>
<div class="tg"><button class="on" data-v="d">Компьютер</button><button data-v="m">Телефон</button></div></div>
<div class="v on" id="d"><div class="fr"><img src="pv_d_0.webp" alt="" loading="lazy"><img src="pv_d_1.webp" alt="" loading="lazy"></div></div><div class="v" id="m"><div class="fr"><img src="pv_m_0.webp" alt="" loading="lazy"><img src="pv_m_1.webp" alt="" loading="lazy"><img src="pv_m_2.webp" alt="" loading="lazy"><img src="pv_m_3.webp" alt="" loading="lazy"><img src="pv_m_4.webp" alt="" loading="lazy"></div></div>
<p class="note">Рабочая версия сайта передаётся после согласования заказа.</p>
<script>document.querySelectorAll('.tg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tg button,.v').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.v).classList.add('on');scrollTo(0,0)});</script>
</body></html>
