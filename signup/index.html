<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Aurora · Join</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#241c18;--mut:#6d5f57;--cream:#f6efe7;--acc:#c2532f}
*{box-sizing:border-box;margin:0;padding:0}
body{font:400 15px/1.5 Inter,sans-serif;color:var(--ink);background:var(--cream);overflow-x:hidden}
.hero{position:relative;height:100svh;min-height:700px;overflow:hidden}
.pic{position:absolute;top:0;right:0;bottom:0;width:64%;-webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.6) 12%,#000 26%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.6) 12%,#000 26%)}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 26%;transform-origin:50% 40%}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(246,239,231,.35),transparent 25%,transparent 70%,rgba(246,239,231,.5))}
body{background:#f1e7de}
header{position:absolute;inset:0 0 auto;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:26px 4vw}
.logo{font:400 30px "Instrument Serif",serif}
.login{font-weight:500;font-size:14px;color:var(--ink);text-decoration:none;padding:11px 22px;border-radius:40px;border:1px solid rgba(36,28,24,.25);background:rgba(246,239,231,.45);backdrop-filter:blur(10px);transition:.2s}.login:hover{background:var(--ink);color:var(--cream)}
.head{position:absolute;z-index:2;left:4vw;top:17vh;max-width:44vw}
.head h1{font:400 clamp(56px,7vw,112px)/.92 "Instrument Serif",serif;letter-spacing:-.02em}
.head h1 em{font-style:italic}
.yrs{display:inline-flex;align-items:baseline;gap:10px;margin-top:22px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.yrs b{font:400 34px/1 "Instrument Serif",serif;letter-spacing:0;color:var(--ink);text-transform:none}
.sheet{position:absolute;z-index:3;left:4vw;bottom:5vh;width:min(980px,80vw);padding:30px 40px 26px;border-radius:26px;background:rgba(246,239,231,.78);backdrop-filter:blur(36px) saturate(1.3);-webkit-backdrop-filter:blur(36px) saturate(1.3);border:1px solid rgba(255,255,255,.55);box-shadow:0 24px 70px rgba(36,28,24,.16)}
.sent{font:400 clamp(26px,2.5vw,38px)/1.6 "Instrument Serif",serif;color:var(--ink)}
.sent input,.sent select{font:italic 400 1em "Instrument Serif",serif;color:var(--ink);background:none;border:0;border-bottom:2px solid rgba(36,28,24,.3);padding:0 4px;margin:0;height:1.3em;line-height:1.3em;outline:none;transition:border-color .2s;appearance:none;-webkit-appearance:none;border-radius:0;vertical-align:baseline}
.sent input::placeholder{color:rgba(36,28,24,.5)}
.sent input:focus,.sent select:focus{border-color:var(--acc)}
.sent select{cursor:pointer}.sent select:invalid{color:rgba(36,28,24,.5)}
.nw{white-space:nowrap}.w-name{width:7.2em}.w-mail{width:9.6em}.w-d{width:2.6em}.w-m{width:4.6em}.w-y{width:3.4em}
.bad{border-color:#d0442a!important}
.row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:20px;flex-wrap:wrap}
.go{height:56px;padding:0 34px;border:0;border-radius:40px;background:var(--ink);color:var(--cream);font:600 16px Inter;cursor:pointer;display:inline-flex;align-items:center;gap:12px;transition:.25s}
.go:hover{background:var(--acc)}
.go span{transition:.25s}.go:hover span{transform:translateX(4px)}
.alt{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px}
.alt button{height:56px;padding:0 24px;border-radius:40px;border:1px solid rgba(36,28,24,.22);background:transparent;color:var(--ink);font:500 14px Inter;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:.2s}
.alt button:hover{background:#fff}
.alt svg{width:17px;height:17px}
.fine{font-size:12px;color:var(--mut);margin-top:14px}.fine a{color:inherit}
.msg{font-size:13px;color:#b23c22;min-height:18px;margin-top:8px}
.ok{display:none;font:400 clamp(28px,3vw,42px)/1.3 "Instrument Serif",serif}.ok em{color:var(--acc)}
.sheet.done form{display:none}.sheet.done .ok{display:block}
@media(max-width:860px){
 .hero{height:auto;min-height:0;overflow:visible}
 .pic{position:relative;width:100%;height:58svh;min-height:400px;overflow:hidden;-webkit-mask-image:none;mask-image:none}
 .veil{background:linear-gradient(180deg,rgba(246,239,231,.3),transparent 20%,transparent 72%,#f1e7de 100%)}
 .ph{object-position:50% 22%}
 .head{position:relative;top:auto;left:auto;max-width:none;margin:-14px 6vw 0}
 .head h1{font-size:clamp(46px,13vw,64px)}
 .yrs{margin-top:14px}
 .sheet{position:relative;left:auto;bottom:auto;transform:none;width:auto;margin:22px 4vw 30px;padding:24px 22px;background:var(--cream);backdrop-filter:none}
 .sent{font-size:26px;line-height:1.75}
 .login{padding:9px 18px}
 .w-name{width:4.6em}
 .sent .nw:last-child{white-space:normal}.w-mail{width:100%}
 .row{flex-direction:column;align-items:stretch}.go{justify-content:center}
 .alt{flex-wrap:wrap}.alt button{flex:1;justify-content:center;height:52px}.alt>span{width:100%;text-align:center}
}
</style></head><body>
<section class="hero">
 <div class="pic"><picture><source media="(max-width:860px)" srcset="girl2-m.webp"><img class="ph" id="ph" src="girl2.webp" alt="Smiling young woman in a field at sunset"></picture><div class="veil"></div></div>
 <header><div class="logo">Aurora</div><a class="login" href="#" onclick="return false">Log in</a></header>
 <div class="head"><h1>Real people.<br><em>Real stories.</em></h1><div class="yrs"><b>20+</b> years bringing people together</div></div>
 <div class="sheet" id="sheet">
  <form id="fm" novalidate>
   <p class="sent">Hi, my name is <span class="nw"><input class="w-name" name="name" placeholder="your name" autocomplete="given-name" aria-label="Name">,</span> you can reach me at <input class="w-mail" name="email" type="email" placeholder="email@example.com" autocomplete="email" aria-label="Email"> and I&nbsp;was born on <span class="nw"><select class="w-d" name="d" required aria-label="Day"><option value="">dd</option></select> <select class="w-m" name="m" required aria-label="Month"><option value="">month</option></select> <select class="w-y" name="y" required aria-label="Year"><option value="">year</option></select>.</span></p>
   <div class="msg" id="msg"></div>
   <div class="row"><button class="go" type="submit">Sign Up <span>→</span></button>
    <div class="alt"><span>or continue with</span>
     <button type="button"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z"/></svg>Google</button>
     <button type="button"><svg viewBox="0 0 24 24" fill="#111"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.6 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.6-1-2.6-4.3zM13.9 4.9c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.6 2.8-1.4z"/></svg>Apple</button></div></div>
   <div class="fine">By signing up you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</div>
  </form>
  <div class="ok">Nice to meet you, <em id="nm"></em>. Check your inbox to confirm your email.</div>
 </div>
</section>
<script src="gsap.min.js"></script>
<script>
const fm=document.getElementById('fm'),[sd,sm,sy]=fm.querySelectorAll('select'),msg=document.getElementById('msg');
for(let i=1;i<=31;i++)sd.add(new Option(i,i));['January','February','March','April','May','June','July','August','September','October','November','December'].forEach((m,i)=>sm.add(new Option(m,i+1)));
const Y=new Date().getFullYear();for(let y=Y-18;y>=Y-100;y--)sy.add(new Option(y,y));
// auto-width inputs
fm.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>{i.classList.remove('bad');msg.textContent=''}));
fm.querySelectorAll('select').forEach(s=>s.addEventListener('change',()=>{s.classList.remove('bad');msg.textContent=''}));
fm.addEventListener('submit',e=>{e.preventDefault();const n=fm.name.value.trim(),em=fm.email.value.trim();let errs=[];
 if(!n){fm.name.classList.add('bad');errs.push('your name')}
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){fm.email.classList.add('bad');errs.push('a valid email')}
 let adult=false;if(sd.value&&sm.value&&sy.value){const b=new Date(sy.value,sm.value-1,sd.value),t=new Date();t.setFullYear(t.getFullYear()-18);adult=b<=t}
 if(!adult){[sd,sm,sy].forEach(s=>!s.value&&s.classList.add('bad'));errs.push('your date of birth (18+)')}
 if(errs.length){msg.textContent='Please add '+errs.join(', ')+'.';return}
 document.getElementById('nm').textContent=n;document.getElementById('sheet').classList.add('done')});
const tl=gsap.timeline({defaults:{ease:'expo.out'}});
tl.from('#ph',{scale:1.12,duration:2.4}).from('.head h1',{y:40,opacity:0,duration:1.4},.3).from('.yrs',{y:20,opacity:0,duration:1.2},.6).from('#sheet',{y:60,opacity:0,duration:1.4},.7);
if(matchMedia('(hover:hover)').matches){const x=gsap.quickTo('#ph','x',{duration:1.6,ease:'power3'}),y=gsap.quickTo('#ph','y',{duration:1.6,ease:'power3'});addEventListener('pointermove',e=>{x((e.clientX/innerWidth-.5)*-14);y((e.clientY/innerHeight-.5)*-10)})}
</script></body></html>
